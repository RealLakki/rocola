<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Anillo decorativo exterior -->
  <circle cx="32" cy="32" r="29" stroke="#C89B3C" stroke-width="2" fill="none"/>

  <!-- Pattern decorativo: 12 triángulos rotados alrededor (estilo medallón vintage) -->
  <g fill="#C89B3C">
    <polygon points="32,3 30,8 34,8" />
    <polygon points="32,3 30,8 34,8" transform="rotate(30 32 32)" />
    <polygon points="32,3 30,8 34,8" transform="rotate(60 32 32)" />
    <polygon points="32,3 30,8 34,8" transform="rotate(90 32 32)" />
    <polygon points="32,3 30,8 34,8" transform="rotate(120 32 32)" />
    <polygon points="32,3 30,8 34,8" transform="rotate(150 32 32)" />
    <polygon points="32,3 30,8 34,8" transform="rotate(180 32 32)" />
    <polygon points="32,3 30,8 34,8" transform="rotate(210 32 32)" />
    <polygon points="32,3 30,8 34,8" transform="rotate(240 32 32)" />
    <polygon points="32,3 30,8 34,8" transform="rotate(270 32 32)" />
    <polygon points="32,3 30,8 34,8" transform="rotate(300 32 32)" />
    <polygon points="32,3 30,8 34,8" transform="rotate(330 32 32)" />
  </g>

  <!-- Sombrero de cowboy sobre la C -->
  <g fill="#C89B3C">
    <ellipse cx="32" cy="22" rx="11" ry="2"/>
    <path d="M 26 22 Q 26 14 32 14 Q 38 14 38 22 Z"/>
  </g>

  <!-- Letra C grande estilo vintage -->
  <path
    d="M 42 32 Q 42 24 32 24 Q 22 24 22 36 Q 22 48 32 48 Q 42 48 42 40"
    stroke="#C89B3C"
    stroke-width="6"
    stroke-linecap="round"
    fill="none"
  />
</svg>
