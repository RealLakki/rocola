<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="55%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#12121F"/>
      <stop offset="100%" stop-color="#0A0A14"/>
    </radialGradient>
  </defs>

  <!-- Fondo oscuro para contraste en la pestaña -->
  <rect width="64" height="64" rx="14" fill="#0A0A14"/>

  <!-- Disco -->
  <circle cx="32" cy="32" r="25" fill="url(#c)" stroke="url(#g)" stroke-width="3"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="rgba(168,85,247,0.30)" stroke-width="1.5"/>

  <!-- Ecualizador -->
  <g stroke="url(#g)" stroke-linecap="round" stroke-width="4">
    <line x1="24" y1="37" x2="24" y2="28"/>
    <line x1="29" y1="41" x2="29" y2="22"/>
    <line x1="35" y1="39" x2="35" y2="25"/>
    <line x1="40" y1="43" x2="40" y2="20"/>
  </g>

  <!-- Centro del vinilo -->
  <circle cx="32" cy="32" r="4.5" fill="url(#g)"/>
  <circle cx="32" cy="32" r="1.6" fill="#0A0A14"/>
</svg>
